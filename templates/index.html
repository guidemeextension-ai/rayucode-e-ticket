<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rayucode E-Ticket Generator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #080d1a 0%, #0f1a3a 50%, #0a0f1e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
    }

    .card {
      background: #0f1830;
      border: 1px solid #1a2744;
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45);
    }

    /* ── Logo ── */
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: drop-shadow(0 0 12px rgba(0,229,255,.35));
    }
    .logo h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #00e5ff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .logo p {
      color: #4a5880;
      font-size: .82rem;
      margin-top: 5px;
    }

    /* ── Form ── */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    label {
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: .9px;
      color: #4a5880;
    }
    label .req { color: #00e5ff; margin-left: 2px; }
    label .opt { color: #4a5880; font-style: italic; margin-left: 4px;
                 text-transform: none; letter-spacing: 0; }

    input[type="text"],
    input[type="password"],
    input[type="tel"],
    input[type="number"] {
      background: #080d1a;
      border: 1px solid #1a2744;
      border-radius: 9px;
      color: #e2e8f0;
      padding: 11px 14px;
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      width: 100%;
    }
    input:focus { border-color: #00e5ff; }
    input::placeholder { color: #2e3f60; }

    /* ── Promo code row with show/hide ── */
    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrap input {
      padding-right: 44px;
    }
    .toggle-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      color: #4a5880;
      padding: 4px;
      line-height: 0;
      transition: color .2s;
      user-select: none;
      display: flex;
      align-items: center;
    }
    .toggle-btn:hover { color: #00e5ff; }
    .toggle-btn svg { width: 18px; height: 18px; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .disc-wrap { position: relative; }
    .disc-wrap input { padding-right: 36px; }
    .disc-wrap .pct {
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      color: #00e5ff; font-weight: 700; font-size: .85rem;
      pointer-events: none;
    }

    .divider { border: none; border-top: 1px solid #1a2744; margin: 20px 0; }

    .btn-generate {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #00e5ff, #0099cc);
      color: #080d1a;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .5px;
      transition: opacity .2s, transform .15s;
    }
    .btn-generate:hover { opacity: .88; transform: translateY(-1px); }

    .error {
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
      border-radius: 9px;
      padding: 12px 16px;
      font-size: .875rem;
      margin-bottom: 18px;
    }

    /* ── Ticket preview ── */
    .preview { margin-top: 28px; text-align: center; }
    .preview img {
      max-width: 100%;
      border-radius: 12px;
      box-shadow: 0 12px 36px rgba(0,0,0,.4);
    }
    .preview-meta { margin-top: 12px; font-size: .8rem; color: #4a5880; }
    .preview-meta strong { color: #00e5ff; font-size: .95rem; }

    .btn-download {
      display: block; width: 100%; margin-top: 14px; padding: 12px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white; border: none; border-radius: 10px;
      font-size: .95rem; font-weight: 700; cursor: pointer;
      text-align: center; transition: opacity .2s, transform .15s;
    }
    .btn-download:hover { opacity: .88; transform: translateY(-1px); }

    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      .row2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- Logo -->
  <div class="logo">
    <img src="/static/img/rayucode-logo.png" alt="Rayucode Logo" />
    <h1>Rayucode E-Ticket</h1>
    <p>Fill in the details below to generate your ticket</p>
  </div>

  {% if error %}
  <div class="error">
    <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24"
         stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:6px;">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
    </svg>
    {{ error }}
  </div>
  {% endif %}

  <form action="/generate" method="POST">

    <!-- Promo Code — required + show/hide toggle -->
    <div class="form-group">
      <label for="promo_code">Promo Code <span class="req">*</span></label>
      <div class="input-wrap">
        <input type="password" id="promo_code" name="promo_code"
               placeholder="Enter promo code…"
               value="{{ promo_code or '' }}" required autocomplete="off" />
        <button type="button" class="toggle-btn" id="togglePromo"
                onclick="toggleVisibility('promo_code', 'togglePromo')"
                title="Show">
          <!-- eye-off (hidden state) -->
          <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
          </svg>
          <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
               style="display:none;">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.97 9.97 0 012.197-3.85M6.83 6.83A9.956 9.956 0 0112 5c4.477 0 8.268 2.943 9.542 7a9.97 9.97 0 01-4.371 5.371M3 3l18 18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Discount — required, preset options + free type -->
    <div class="form-group">
      <label for="discount">Discount Percentage <span class="req">*</span></label>
      <div class="disc-wrap">
        <input type="number" id="discount" name="discount"
               placeholder="Select or type…" min="0" max="100" step="0.01"
               list="discount-options" required />
        <span class="pct">%</span>
      </div>
      <datalist id="discount-options">
        <option value="30">30%</option>
        <option value="40">40%</option>
        <option value="50">50%</option>
        <option value="70">70%</option>
        <option value="75">75%</option>
        <option value="90">90%</option>
        <option value="100">100%</option>
      </datalist>
    </div>

    <hr class="divider" />

    <!-- Name & Phone — optional -->
    <div class="row2">
      <div class="form-group">
        <label for="customer_name">Customer Name <span class="opt">(optional)</span></label>
        <input type="text" id="customer_name" name="customer_name"
               placeholder="e.g. John Doe" />
      </div>
      <div class="form-group">
        <label for="phone">Contact / Phone <span class="opt">(optional)</span></label>
        <input type="tel" id="phone" name="phone"
               placeholder="e.g. +855 12 000 000" />
      </div>
    </div>

    <button type="submit" class="btn-generate">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:6px;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      Generate Ticket
    </button>
  </form>

  {% if ticket_image %}
  <div class="preview">
    <img src="data:image/jpeg;base64,{{ ticket_image }}" alt="Generated Ticket" />
    <div class="preview-meta">Code: <strong>{{ promo_code }}</strong></div>
  </div>
  <form action="/download" method="POST">
    <input type="hidden" name="promo_code" value="{{ promo_code }}" />
    <button type="submit" class="btn-download">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none"
           viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="vertical-align:middle;margin-right:6px;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
      </svg>
      Download Ticket JPG
    </button>
  </form>
  {% endif %}

</div>

<script>
  function toggleVisibility(inputId, btnId) {
    const input   = document.getElementById(inputId);
    const iconEye    = document.getElementById('icon-eye');
    const iconEyeOff = document.getElementById('icon-eye-off');
    if (input.type === 'password') {
      input.type = 'text';
      iconEye.style.display    = 'none';
      iconEyeOff.style.display = '';
    } else {
      input.type = 'password';
      iconEye.style.display    = '';
      iconEyeOff.style.display = 'none';
    }
  }
</script>

</body>
</html>
